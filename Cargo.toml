[package]
name = "lserve"
version = "1.0.1"
edition = "2024"
rust-version = "1.88"
authors = ["Mooyeon LEE"]
license = "MIT"
description = "A lightweight local/private HTTPS static server, Markdown viewer, and Host/path-based reverse proxy for local applications."
repository = "https://github.com/flymylee/lserve"
readme = "README.md"
keywords = ["localhost", "https", "static-server", "markdown", "reverse-proxy"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
anyhow = "1.0"
bytes = "1.12"
comrak = { version = "0.55", default-features = false }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
libc = "0.2"
mime_guess = "2.0"
percent-encoding = "2.3"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs", "x509-parser"] }
rustls = { version = "0.23.27", default-features = false, features = ["std", "aws_lc_rs", "prefer-post-quantum", "tls12"] }
rustls-pemfile = "2.2"
syntect = { version = "5.3", default-features = false, features = ["default-fancy", "yaml-load"] }
time = { version = "=0.3.55", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "sync", "time", "signal"] }
tokio-rustls = "0.26.5"
tokio-util = { version = "0.7", features = ["io"] }
x509-parser = "0.18.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
